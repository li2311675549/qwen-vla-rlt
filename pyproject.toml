[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-vla-rlt"
version = "0.1.0"
description = "Validated Qwen task planning, pi0.5 skill execution, and RLT routing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
neural = ["torch>=2.7,<3"]
qwen = ["torch>=2.7,<3", "transformers>=4.57,<5", "peft>=0.17,<1", "accelerate>=1,<2", "Pillow>=10"]

[project.scripts]
qwen-vla-sft = "qwen_vla_rlt.qwen:main"
qwen-vla-rlt-train = "qwen_vla_rlt.rlt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
